steps:
- id: annual-oil-2025-data-only
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
  entrypoint: python3
  secretEnv: [UN_COMTRADE_API_KEY]
  env: [BUILD_ID=$BUILD_ID, PYTHONUNBUFFERED=1]
  args: [pipeline/oil_pivot_2025/worker.py, --loader-sha, '${_LOADER_SHA}']
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/un-comtrade-api-key-02/versions/latest
    env: UN_COMTRADE_API_KEY
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/czbudget-janrezab/serviceAccounts/psd-data-builder@czbudget-janrezab.iam.gserviceaccount.com
tags: [plane-data, oil-pivot-annual-2025]
timeout: 1800s
queueTtl: 600s
substitutions:
  _LOADER_SHA: ''
