# Data plane only: Czech municipal budget history 2010-2025 -> BigQuery.
# Submit from the dedicated worktree with ONLY this directory as source:
#   gcloud builds submit pipeline/czech_history_bq --project=czbudget-janrezab \
#     --region=europe-west4 \
#     --service-account=projects/czbudget-janrezab/serviceAccounts/psd-data-builder@czbudget-janrezab.iam.gserviceaccount.com \
#     --config=pipeline/czech_history_bq/cloudbuild.czech-history-bq.yaml \
#     --substitutions=_SOURCE_SHA=<pinned website commit>,_LOADER_SHA=<this branch commit>
# Never europe-west1, never the web identity, never Cloud Run.
steps:
  - id: load-validate-publish-czech-municipal-history
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: python3
    env: [PYTHONUNBUFFERED=1, 'BUILD_ID=$BUILD_ID', 'PROJECT_ID=$PROJECT_ID']
    args:
      - load_czech_history.py
      - --source-sha
      - '${_SOURCE_SHA}'
      - --loader-sha
      - '${_LOADER_SHA}'
      - --region
      - europe-west4
      - --stage-dataset
      - processing_czech_history
timeout: 1800s
queueTtl: 900s
tags: [plane-data, data-publication, czech-municipal-history]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SOURCE_SHA: required
  _LOADER_SHA: required
