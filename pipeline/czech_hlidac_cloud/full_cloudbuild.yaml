steps:
  - id: load-top-100-municipality-contract-histories
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: python3
    args: [pipeline/czech_hlidac_cloud/full_worker.py]
    env:
      - BUILD_ID=$BUILD_ID
      - LOADER_GIT_SHA=${_LOADER_GIT_SHA}
    secretEnv:
      - HLIDACSTATU_API_TOKEN
    timeout: 72000s
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hlidacstatu-api-token/versions/latest
      env: HLIDACSTATU_API_TOKEN
timeout: 75600s
tags: [plane-data, czech-hlidac-full]
substitutions:
  _LOADER_GIT_SHA: unknown
options:
  diskSizeGb: 100
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
