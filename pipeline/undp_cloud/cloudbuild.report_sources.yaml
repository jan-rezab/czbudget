steps:
  - id: acquire-stage-validate-publish-original-provider-records
    name: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    entrypoint: bash
    env: ['BUILD_ID=$BUILD_ID', 'PYTHONUNBUFFERED=1', 'SOURCE_GROUP=${_SOURCE_GROUP}', 'RESUME_RUN=${_RESUME_RUN}', 'LOADER_SHA=${_LOADER_SHA}', 'WID_SHARD_INDEX=${_WID_SHARD_INDEX}', 'WID_SHARD_COUNT=${_WID_SHARD_COUNT}']
    args:
      - -c
      - |
        pip install --quiet --disable-pip-version-check -r pipeline/undp_cloud/requirements.txt
        pip install --quiet --disable-pip-version-check pyarrow==21.0.0
        python pipeline/undp_cloud/cloud_fixture_contract.py
        python pipeline/undp_cloud/report_sources.py --loader-sha "$${LOADER_SHA}" --source-group "$${SOURCE_GROUP}" --resume-run "$${RESUME_RUN}" --wid-shard-index "$${WID_SHARD_INDEX}" --wid-shard-count "$${WID_SHARD_COUNT}"
timeout: 2400s
queueTtl: 1800s
tags: [plane-data, hdr-original-sources]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOADER_SHA: required
  _SOURCE_GROUP: all
  _RESUME_RUN: ""
  _WID_SHARD_INDEX: "0"
  _WID_SHARD_COUNT: "1"
