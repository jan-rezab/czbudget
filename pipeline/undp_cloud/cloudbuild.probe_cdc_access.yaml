steps:
  - id: bounded-official-cdc-access
    name: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    entrypoint: bash
    env: ['BUILD_ID=$BUILD_ID', 'LOADER_SHA=${_LOADER_SHA}', 'PYTHONUNBUFFERED=1']
    args:
      - -ceu
      - |
        pip install --quiet --disable-pip-version-check google-cloud-storage==3.4.1
        python -m unittest discover -s pipeline/undp_cloud -p test_probe_cdc_access.py
        python pipeline/undp_cloud/probe_cdc_access.py
timeout: 300s
queueTtl: 300s
tags: [plane-data, hdr-cdc-access]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOADER_SHA: required
