steps:
  - id: immutable-raw-acquisition-and-schema-inspection
    name: python:3.12-slim
    entrypoint: bash
    env: ['BUILD_ID=$BUILD_ID', 'PYTHONUNBUFFERED=1']
    args:
      - -c
      - |
        pip install --quiet --disable-pip-version-check -r pipeline/undp_cloud/requirements.txt
        python pipeline/undp_cloud/acquire.py --loader-sha '${_LOADER_SHA}'
timeout: 1200s
queueTtl: 1800s
tags: [plane-data, undp-human-development, raw-acquisition]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOADER_SHA: required
