steps:
  - id: verify-stage-validate-and-atomically-publish-undp
    name: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    entrypoint: bash
    env: ['BUILD_ID=$BUILD_ID', 'PYTHONUNBUFFERED=1']
    args:
      - -c
      - |
        pip install --quiet --disable-pip-version-check -r pipeline/undp_cloud/requirements.txt
        python pipeline/undp_cloud/publish.py --loader-sha '${_LOADER_SHA}' --raw-manifest '${_RAW_MANIFEST}' --manifest-generation '${_MANIFEST_GENERATION}' --manifest-sha '${_MANIFEST_SHA}'
timeout: 1800s
queueTtl: 1800s
tags: [plane-data, undp-human-development, warehouse-publication]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOADER_SHA: required
  _RAW_MANIFEST: required
  _MANIFEST_GENERATION: required
  _MANIFEST_SHA: required
