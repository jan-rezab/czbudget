steps:
  - id: bounded-russia-suppliers-serving-publication
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    env: ['BUILD_ID=$BUILD_ID', 'PYTHONUNBUFFERED=1']
    args:
      - -ceu
      - |
        PYTHONPATH=pipeline/russia_suppliers python3 -m unittest test_publish test_cloud_clients
        python3 pipeline/russia_suppliers/publish.py --loader-sha '${_LOADER_SHA}'
timeout: 600s
queueTtl: 300s
tags: [plane-data, russia-suppliers-serving, bounded-bigquery]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOADER_SHA: required
