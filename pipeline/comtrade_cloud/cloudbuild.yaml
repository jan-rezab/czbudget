steps:
  - id: crawl-released-comtrade-data
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: python3
    secretEnv: [UN_COMTRADE_API_KEY_01, UN_COMTRADE_API_KEY_02, UN_COMTRADE_API_KEY_03, UN_COMTRADE_API_KEY_04, UN_COMTRADE_API_KEY_05, UN_COMTRADE_API_KEY_06, UN_COMTRADE_API_KEY_07, UN_COMTRADE_API_KEY_08, UN_COMTRADE_API_KEY_09, UN_COMTRADE_API_KEY_10, UN_COMTRADE_API_KEY_11, UN_COMTRADE_API_KEY_12, UN_COMTRADE_API_KEY_13, UN_COMTRADE_API_KEY_14, UN_COMTRADE_API_KEY_15, UN_COMTRADE_API_KEY_16, UN_COMTRADE_API_KEY_17, UN_COMTRADE_API_KEY_18, UN_COMTRADE_API_KEY_19, UN_COMTRADE_API_KEY_20, UN_COMTRADE_API_KEY_21, UN_COMTRADE_API_KEY_22, UN_COMTRADE_API_KEY_23, UN_COMTRADE_API_KEY_24, UN_COMTRADE_API_KEY_25, UN_COMTRADE_API_KEY_26, UN_COMTRADE_API_KEY_27, UN_COMTRADE_API_KEY_28, UN_COMTRADE_API_KEY_29]
