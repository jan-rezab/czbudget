      - CZBUDGET_WORKSPACE_ROOT=/workspace/comtrade-control
    args:
      - pipeline/transforms/run_un_comtrade_direct.py
      - --max-calls-per-account
      - '${_MAX_CALLS}'
      - --batch-rows
      - '1000000'
      - --max-minutes
      - '120'
      - --lanes-per-account
      - '1'
      - --chunk-calls
      - '10'
      - --checkpoint-seconds
      - '60'
      - --history-periods
      - '36'
      - --monthly-prior-months
      - '3'
      - --monthly-focus-share
      - '0.8'
    timeout: 7200s
timeout: 7500s
queueTtl: 1800s
tags: [plane-data, comtrade-crawl]
