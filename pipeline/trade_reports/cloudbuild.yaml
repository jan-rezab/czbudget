steps:
- id: validated-trade-report-publication
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
  entrypoint: python3
  env:
  - BUILD_ID=$BUILD_ID
  - PYTHONUNBUFFERED=1
  args:
  - pipeline/trade_reports/publish.py
  - --loader-sha
  - '${_LOADER_SHA}'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/czbudget-janrezab/serviceAccounts/psd-data-builder@czbudget-janrezab.iam.gserviceaccount.com
tags: [plane-data, trade-report-serving]
timeout: 1800s
queueTtl: 600s
substitutions:
  _LOADER_SHA: ''
