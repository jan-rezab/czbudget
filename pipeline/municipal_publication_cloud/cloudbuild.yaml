steps:
  - id: extract-pinned-warehouse-selection
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: python3
    env:
      - BUILD_ID=$BUILD_ID
    args:
      - worker.py
      - extract
      - --country
      - ${_COUNTRY}
      - --run-id
      - $BUILD_ID
      - --loader-git-sha
      - ${_LOADER_GIT_SHA}
      - --work
      - /workspace/municipal-publication
  - id: archive-immutable-selection
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        destination="gs://czbudget-janrezab-data-layers/processing-runs/municipal-publication/$BUILD_ID/raw"
        gcloud storage cp --if-generation-match=0 --recursive /workspace/municipal-publication/raw "$${destination}"
  - id: build-country-candidate-and-proof
    name: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    entrypoint: python3
    args:
      - worker.py
      - build
      - --country
      - ${_COUNTRY}
      - --run-id
      - $BUILD_ID
      - --loader-git-sha
      - ${_LOADER_GIT_SHA}
      - --work
      - /workspace/municipal-publication
  - id: validate-candidate
    name: python:3.12-slim@sha256:78387bc3881c8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    entrypoint: python3
    args:
      - worker.py
      - validate
      - --country
      - ${_COUNTRY}
      - --run-id
      - $BUILD_ID
      - --loader-git-sha
      - ${_LOADER_GIT_SHA}
      - --work
      - /workspace/municipal-publication
  - id: publish-completed-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        destination="gs://czbudget-janrezab-data-layers/processing-runs/municipal-publication/$BUILD_ID"
        gcloud storage cp --if-generation-match=0 --recursive /workspace/municipal-publication/candidate "$${destination}/candidate"
        gcloud storage cp --if-generation-match=0 /workspace/municipal-publication/completed.json "$${destination}/completed.json"
timeout: 3600s
queueTtl: 1800s
tags: [plane-data, municipal-publication, candidate]
substitutions:
  _COUNTRY: POL
  _LOADER_GIT_SHA: unknown
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
