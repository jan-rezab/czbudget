      content="Porovnejte dvacet let harmonizovaných ukazatelů veřejných financí deseti zemí."

  <body class="home-v2 comparison-page" data-page="comparison">
    <psd-site-header></psd-site-header>
    <main id="top">
      <section class="page-hero">
        <div>
          <span class="kicker" data-i18n="compareKicker">Srovnání zemí</span>
          <h1 data-i18n="compareTitle">Srovnání veřejných financí</h1>
          <p data-i18n="compareCopy">
            Vyberte ukazatel, rok a vlastní sadu zemí. U každého pohledu
            ukazujeme definici, hranici srovnání a cestu k původnímu zdroji.
          </p>
        </div>
        <aside>
          <strong id="comparison-coverage-count">— × 20</strong
          ><span data-i18n="compareCoverage"
            >zemí × let harmonizovaných dat</span
          >
        </aside>
      </section>
      <section class="compare-compact" id="compare">
        <div class="compact-controls">
          <label
            ><span data-i18n="year">Rok</span
            ><select id="year-select"></select></label
          ><label
            ><span data-i18n="explorerView">Pohled</span
            ><select id="comparison-view">
              <option value="selected" data-i18n="selectedCountries">
                Moje země
              </option>
              <option value="large" data-i18n="heroLargeCountries">
                Top 20 · 5 mil. a více
              </option>
              <option value="small" data-i18n="heroSmallCountries">
                Top 20 · méně než 5 mil.
              </option>
              <option value="all" data-i18n="heroAllCountries">
                Top 20 · všechny země
              </option>
            </select></label
          ><label class="comparison-country-control"
            ><span data-i18n="addCountry">Přidat zemi</span
            ><input
              id="comparison-country"
              type="search"
              list="comparison-country-options"
              placeholder="Přidat zemi…"
              autocomplete="off"
            />
            <datalist id="comparison-country-options"></datalist></label
          ><label
            ><span data-i18n="benchmarkCountry">Benchmark země</span
            ><select id="benchmark-country"></select
          ></label>
        </div>
        <div class="cmp-selection" id="comparison-selection" aria-live="polite"></div>
        <div class="cmp-controls">
          <span id="compare-perimeter-label" data-i18n="scopeLabel">Rozsah</span>
          <div
            class="cmp-pills"
            id="compare-perimeters"
            role="group"
            aria-labelledby="compare-perimeter-label"
          ></div>
          <p class="cmp-perimeter-note" id="compare-perimeter-note"></p>
        </div>
        <div class="cmp-controls">
          <span id="compare-metric-label" data-i18n="metric">Ukazatel</span>
          <div
            class="cmp-pills"
            id="compare-metrics"
            role="group"
            aria-labelledby="compare-metric-label"
          ></div>
        </div>
        <dl class="cmp-contract" id="compare-contract"></dl>
        <aside class="cmp-provenance" id="compare-provenance" aria-live="polite"></aside>
        <div class="cmp-result" id="compare-result" aria-live="polite"></div>
        <section class="oecd-scatter-panel" id="oecd-scatter" aria-live="polite"></section>
        <div
          class="benchmark-overview"
          id="benchmark-overview"
          aria-live="polite"
        ></div>
      </section>
      <section class="demographic-pressure-section" id="demographic-pressure" aria-label="Demographic pressure">
        <div id="demographic-pressure-root" aria-live="polite"></div>
      </section>
    </main>
    <footer data-global-footer></footer>
  </body>
</html>
