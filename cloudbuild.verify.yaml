# Full application verification against the exact data releases already
# published to production. This build is read-only: it never queries the
# warehouse, rebuilds data, uploads artifacts, changes pointers or deploys.
steps:
  - id: python-contracts
    waitFor: ["-"]
    # Pipeline contracts invoke both Python and Node. Match the browser/API
    # worker's Python ABI so shared compiled dependencies remain compatible.
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    env: [PYTHONPATH=/workspace/.python-deps]
    args:
      - -ceu
      - |
        if ! python3 -m pip --version; then
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-pip
        fi
        python3 -m pip install --disable-pip-version-check --target=/workspace/.python-deps -r pipeline/requirements.txt
        python3 -m unittest discover -s pipeline/tests -p 'test_*.py'
        python3 -m unittest tests.test_cloud_verification tests.test_deployment_event
        python3 -m unittest discover -s tests -p test_runtime_assets.py

  - id: preflight-components
    waitFor: ["-"]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        node scripts/build-chart-assets.mjs --check
        node scripts/validate-chart-ownership.mjs
        npm run check:stories
        node --test tests/unit/bounded-command.spec.mjs
        node scripts/run-component-gate.mjs

  - id: hydrate-published-releases
    waitFor: ["-"]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/.published/municipal/releases
        mkdir -p /workspace/.published/cityvizor/releases
        mkdir -p /workspace/.published/assets
        gcloud storage cp ${_PUBLIC_SNAPSHOT_BASE_URL}/current.json /workspace/.published/municipal/current.json
        gcloud storage cp ${_CITYVIZOR_SNAPSHOT_BASE_URL}/current.json /workspace/.published/cityvizor/current.json
        gcloud storage cp ${_STATIC_ASSET_BASE_URL}/current.json /workspace/.published/assets/lock.json
        python3 - <<'PY'
        import json
        from pathlib import Path
        root = Path('/workspace/.published')
        municipal = json.loads((root / 'municipal/current.json').read_text())
        cityvizor = json.loads((root / 'cityvizor/current.json').read_text())
        assets = json.loads((root / 'assets/lock.json').read_text())
        (root / 'municipal-release').write_text(municipal['release_id'])
        (root / 'cityvizor-release').write_text(cityvizor['release_id'])
        with (root / 'asset-packs.tsv').open('w') as output:
            for pack in assets['packs'].values():
                output.write(pack['key'] + '\t' + pack['file'] + '\n')
        PY
        municipal_release="$$(cat /workspace/.published/municipal-release)"
        cityvizor_release="$$(cat /workspace/.published/cityvizor-release)"
        gcloud storage rsync -r ${_PUBLIC_SNAPSHOT_BASE_URL}/releases/$$municipal_release /workspace/.published/municipal/releases/$$municipal_release
        gcloud storage rsync -r ${_CITYVIZOR_SNAPSHOT_BASE_URL}/releases/$$cityvizor_release /workspace/.published/cityvizor/releases/$$cityvizor_release
        while IFS=$$'\t' read -r key file; do
          gcloud storage cp "gs://czbudget-janrezab-public-snapshots/$$key" "/workspace/.published/assets/$$file"
        done < /workspace/.published/asset-packs.tsv

  - id: verify-published-snapshots
    waitFor: [hydrate-published-releases]
    name: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    entrypoint: sh
    args:
      - -ceu
      - |
        municipal_release="$$(cat /workspace/.published/municipal-release)"
        cityvizor_release="$$(cat /workspace/.published/cityvizor-release)"
        node scripts/validate-public-serving-snapshot.mjs /workspace/.published/municipal
        node scripts/validate-cityvizor-cloud-release.mjs /workspace/.published/cityvizor/releases/$$cityvizor_release

  - id: verify-published-assets
    waitFor: [hydrate-published-releases]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        python3 scripts/verify-runtime-assets-cloud.py /workspace/.published/assets/lock.json

  - id: validate-source-contract
    waitFor: ["-"]
    name: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    entrypoint: sh
    args:
      - -ceu
      - |
        node scripts/validate-build-planes.mjs
        node pipeline/create-source-manifest.mjs --self-check

  - id: browser-contrast-a
    timeout: 1080s
    waitFor: [preflight-components, python-contracts, verify-published-snapshots, verify-published-assets, validate-source-contract]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    env:
      - CI=true
      - PYTHONPATH=/workspace/.python-deps
      - DATA_ASSET_LOCK=/workspace/.published/assets/lock.json
      - DATA_ASSET_PACK_ROOT=/workspace/.published/assets
      - PUBLIC_SNAPSHOT_RELEASE_ROOT=/workspace/.published/municipal
      - CITYVIZOR_SNAPSHOT_RELEASE_ROOT=/workspace/.published/cityvizor
    args:
      - -ceu
      - |
        trap 'status=$$?; if [ "$$status" -ne 0 ]; then tail -c 48000 /tmp/browser-gate.log > "$$BUILDER_OUTPUT/output"; fi; exit $$status' EXIT
        exec > >(tee /tmp/browser-gate.log) 2>&1
        npm run test:api
        # Validate the source checkout, not an in-build warehouse merge. The
        # independently published runtime releases have their own gates above.
        PSD_BUILD_MODE=local npm run validate
        node --test tests/unit/funding-ledgers.spec.mjs tests/unit/funding-deep-dive.spec.mjs tests/unit/funding-systems.spec.mjs
        node --test tests/industrial-data.test.cjs
        for shard in 1 3; do
          node scripts/run-bounded.mjs -- npx playwright test --workers=2 --max-failures=1 --retries=0 --reporter=line --global-timeout=420000 --shard=$$shard/4 --output=/workspace/test-results/shard-$$shard
        done

  - id: browser-contrast-b
    timeout: 1080s
    waitFor: [preflight-components, verify-published-snapshots, verify-published-assets, validate-source-contract]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    env:
      - CI=true
      - DATA_ASSET_LOCK=/workspace/.published/assets/lock.json
      - DATA_ASSET_PACK_ROOT=/workspace/.published/assets
      - PUBLIC_SNAPSHOT_RELEASE_ROOT=/workspace/.published/municipal
      - CITYVIZOR_SNAPSHOT_RELEASE_ROOT=/workspace/.published/cityvizor
    args:
      - -ceu
      - |
        trap 'status=$$?; if [ "$$status" -ne 0 ]; then tail -c 48000 /tmp/browser-gate.log > "$$BUILDER_OUTPUT/output"; fi; exit $$status' EXIT
        exec > >(tee /tmp/browser-gate.log) 2>&1
        for shard in 2 4; do
          node scripts/run-bounded.mjs -- npx playwright test --workers=2 --max-failures=1 --retries=0 --reporter=line --global-timeout=420000 --shard=$$shard/4 --output=/workspace/test-results/shard-$$shard
        done

  - id: nginx-routing
    waitFor: [validate-source-contract]
    name: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    entrypoint: sh
    env: [PORT=8080]
    args:
      - -ceu
      - |
        mkdir -p /etc/nginx/templates
        cp nginx.conf.template /etc/nginx/templates/default.conf.template
        /docker-entrypoint.d/20-envsubst-on-templates.sh
        sed -i 's@root /usr/share/nginx/html;@root /workspace;@' /etc/nginx/conf.d/default.conf
        nginx -t
        nginx
        wget -qO /tmp/process-log.html 'http://127.0.0.1:8080/process/log/?lang=en'
        grep -q 'run-log.js' /tmp/process-log.html
        wget -qO /tmp/france.html 'http://127.0.0.1:8080/municipalities/france/profile/?code=31555'
        grep -q 'data-profile-root=' /tmp/france.html

  - id: verification-complete
    waitFor: [browser-contrast-a, browser-contrast-b, nginx-routing, python-contracts]
    name: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    entrypoint: sh
    args: [-ceu, 'echo "Full verification passed against published immutable data releases."']

timeout: 1200s
queueTtl: 600s
tags: [plane-verification, full-browser]

options:
  # Regional quota permits this worker. Limit total browser concurrency to four;
  # four smaller shards also release browser/data-server memory between batches.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PUBLIC_SNAPSHOT_BASE_URL: gs://czbudget-janrezab-public-snapshots/municipal
  _CITYVIZOR_SNAPSHOT_BASE_URL: gs://czbudget-janrezab-public-snapshots/cityvizor
  _STATIC_ASSET_BASE_URL: gs://czbudget-janrezab-public-snapshots/static-assets
