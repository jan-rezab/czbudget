<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared chart contract fixture</title><script src="/lib/chart-renderer.js"></script><script src="/psd-chart.js"></script><link rel="stylesheet" href="/shared-charts.css" data-shared-charts><link rel="stylesheet" href="/psd-chart.css"></head><body style="margin:16px;background:#f1ede3"><main><h1>Shared chart contracts</h1><figure id="chart-object"><div id="plot"></div></figure><script>
const params = new URLSearchParams(location.search);
const rows = [{year:2022,revenue:100,expense:70},{year:2023,revenue:null,expense:90},{year:2024,revenue:0,expense:0},{year:2025,revenue:140,expense:-20}];
const plot=window.PSDPlot.render(document.querySelector('#plot'), {type:params.get('type')||'line',title:'Reported municipal finances',unit:'EUR',rows,fields:[{key:'revenue',label:'Revenue',format:value=>`${value} EUR`},{key:'expense',label:'Expenditure',format:value=>`${value} EUR`}]});
window.chartObject=window.PSDChart.register({slug:'fixture-reported-finances',el:document.querySelector('#chart-object'),title:'Reported municipal finances',accessor:plot.accessor,exports:['csv']});
</script></main></body></html>
