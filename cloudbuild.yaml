# Production promotion is code-only. Data ingestion and data-release publication
# run independently and expose validated versions through GCS current.json pointers.
steps:
  - id: verification-input
    waitFor: ["-"]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        if ! git rev-parse --verify "$COMMIT_SHA^" >/dev/null 2>&1; then
          git fetch --depth=2 origin "$COMMIT_SHA"
        fi
        gcloud run services describe czbudget-public --project="$PROJECT_ID" --region=europe-west1 --format=json > /workspace/.live-service.json
        revision=$$(python3 -c 'import json; t=json.load(open(".live-service.json"))["status"].get("traffic",[]); active=[r for r in t if r.get("percent",0)>0]; print(active[0].get("revisionName","") if len(active)==1 and active[0].get("percent")==100 else "")')
        deployed=""
        if [ -n "$$revision" ]; then
          deployed=$$(gcloud run revisions describe "$$revision" --project="$PROJECT_ID" --region=europe-west1 --format='value(metadata.labels.git-sha)')
        fi
        printf '%s\n' "$$deployed" > /workspace/.verification-deployed
        base=$${deployed:-$$(git rev-parse "$COMMIT_SHA^")}
        if ! git cat-file -e "$$base^{tree}" 2>/dev/null; then
          git fetch --depth=1 origin "$$base"
        fi
        printf '%s\n' "$$base" > /workspace/.verification-base
        git diff --name-only "$$base" "$COMMIT_SHA" > /workspace/.verification-files

  - id: assert-single-production
    waitFor: ["-"]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: sh
    args: [scripts/assert-single-production.sh, $PROJECT_ID, europe-west1, czbudget-public]

  - id: build-process-log
    waitFor: ["-"]
    name: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    entrypoint: node
    args: [scripts/build-run-log.mjs, --write]
    env: [COMMIT_SHA=$COMMIT_SHA, BUILD_ID=$BUILD_ID]

  - id: source-contracts
    waitFor: [verification-input]
    name: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    entrypoint: sh
    args:
      - -ceu
      - |
        node scripts/publish-stories.mjs --check
        node scripts/build-chart-assets.mjs --check
        node scripts/validate-chart-ownership.mjs
        node scripts/build-chart-coverage.mjs --check
        node scripts/validate-ui-environment.mjs --runtime
        node scripts/validate-release-contract.mjs
        # Git-backed sparse fixture runs in the verifier; this runtime image has no Git.
        node --test tests/unit/chart-renderer.spec.mjs tests/unit/chart-registry.spec.mjs tests/unit/release-contract.spec.mjs tests/unit/verification-plan.spec.mjs
        node --test tests/unit/stories.spec.mjs
        node --test tests/api/static-assets.spec.mjs tests/api/pinned-release.spec.mjs
        node --test tests/api/process-log-store.spec.mjs
        node pipeline/create-source-manifest.mjs --self-check
        COMMIT_SHA="$COMMIT_SHA" node scripts/prepare-production-verification.mjs

  - id: assert-verified-candidate
    waitFor: [source-contracts]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        # Both lanes verify inside this build; deploy waits for component or full verification.
        echo "Release lane: $$(python3 -c 'import json; print(json.load(open(".verification-plan.json"))["lane"])')"

  - id: component-verification
    waitFor: [source-contracts]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "$$(node scripts/release-verification.mjs .verification-plan.json)" = component ]; then
          npm ci
          node scripts/run-component-gate.mjs .verification-plan.json
        else
          echo "Full candidate: exhaustive verification runs in full-verification."
        fi

  # Full lane: the exhaustive suite runs here against the published immutable data
  # releases, in place of a separate verification build and a second push.
  - id: hydrate-published-releases
    waitFor: [source-contracts]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "$$(python3 -c 'import json; print(json.load(open("/workspace/.verification-plan.json"))["lane"])')" != full ]; then echo "Component lane: no published data needed."; exit 0; fi
        mkdir -p /workspace/.published/municipal/releases /workspace/.published/cityvizor/releases /workspace/.published/assets
        gcloud storage cp ${_PUBLIC_SNAPSHOT_BASE_URL}/current.json /workspace/.published/municipal/current.json
        gcloud storage cp ${_CITYVIZOR_SNAPSHOT_BASE_URL}/current.json /workspace/.published/cityvizor/current.json
        gcloud storage cp ${_STATIC_ASSET_BASE_URL}/current.json /workspace/.published/assets/lock.json
        python3 - <<'PY'
        import json
        from pathlib import Path
        root = Path('/workspace/.published')
        (root / 'municipal-release').write_text(json.loads((root / 'municipal/current.json').read_text())['release_id'])
        (root / 'cityvizor-release').write_text(json.loads((root / 'cityvizor/current.json').read_text())['release_id'])
        with (root / 'asset-packs.tsv').open('w') as output:
            for pack in json.loads((root / 'assets/lock.json').read_text())['packs'].values():
                output.write(pack['key'] + '\t' + pack['file'] + '\n')
        PY
        municipal_release="$$(cat /workspace/.published/municipal-release)"
        cityvizor_release="$$(cat /workspace/.published/cityvizor-release)"
        # macOS "._" resource forks in the CityVizor release are never read; skip them.
        gcloud storage rsync -r --exclude='(^|.*/)\._[^/]*$$' ${_PUBLIC_SNAPSHOT_BASE_URL}/releases/$$municipal_release /workspace/.published/municipal/releases/$$municipal_release
        gcloud storage rsync -r --exclude='(^|.*/)\._[^/]*$$' ${_CITYVIZOR_SNAPSHOT_BASE_URL}/releases/$$cityvizor_release /workspace/.published/cityvizor/releases/$$cityvizor_release
        while IFS=$$'\t' read -r key file; do
          gcloud storage cp "gs://czbudget-janrezab-public-snapshots/$$key" "/workspace/.published/assets/$$file"
        done < /workspace/.published/asset-packs.tsv
        python3 scripts/verify-runtime-assets-cloud.py /workspace/.published/assets/lock.json

  - id: verify-published-releases
    waitFor: [hydrate-published-releases]
    name: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ ! -f /workspace/.published/municipal-release ]; then echo "Component lane."; exit 0; fi
        node scripts/validate-public-serving-snapshot.mjs /workspace/.published/municipal
        node scripts/validate-cityvizor-cloud-release.mjs /workspace/.published/cityvizor/releases/$$(cat /workspace/.published/cityvizor-release)

  # Pipeline contracts need neither the image nor published data; run them beside the image build.
  - id: full-python-contracts
    waitFor: [source-contracts]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    env: [PYTHONPATH=/workspace/.python-deps]
    args:
      - -ceu
      - |
        if [ "$$(python3 -c 'import json; print(json.load(open("/workspace/.verification-plan.json"))["lane"])')" != full ]; then echo "Component lane."; exit 0; fi
        if ! python3 -m pip --version; then apt-get update -qq; apt-get install -y --no-install-recommends python3-pip; fi
        python3 -m pip install --disable-pip-version-check --target=/workspace/.python-deps -r pipeline/requirements.txt
        python3 -m unittest discover -s pipeline/tests -p 'test_*.py'
        python3 -m unittest tests.test_cloud_verification

  - id: full-verification
    timeout: 1320s
    # After the candidate-image browser contract, so two browser pools never share the worker.
    waitFor: [verify-published-releases, image-browser-contract, full-python-contracts]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    env:
      - CI=true
      - PYTHONPATH=/workspace/.python-deps
      - DATA_ASSET_LOCK=/workspace/.published/assets/lock.json
      - DATA_ASSET_PACK_ROOT=/workspace/.published/assets
      - PUBLIC_SNAPSHOT_RELEASE_ROOT=/workspace/.published/municipal
      - CITYVIZOR_SNAPSHOT_RELEASE_ROOT=/workspace/.published/cityvizor
    args:
      - -ceu
      - |
        if [ "$$(node scripts/release-verification.mjs .verification-plan.json)" != full ]; then echo "Component lane verified in component-verification."; exit 0; fi
        test -d node_modules/@playwright/test || npm ci
        node scripts/validate-build-planes.mjs
        npm run test:api
        PSD_BUILD_MODE=local npm run validate
        node --test tests/unit/funding-ledgers.spec.mjs tests/unit/funding-deep-dive.spec.mjs tests/unit/funding-systems.spec.mjs
        node --test tests/industrial-data.test.cjs
        # One data-server cache at a time, four parallel browsers per batch.
        for shard in 1 2 3 4; do
          node scripts/run-bounded.mjs -- npx playwright test --workers=4 --max-failures=1 --retries=0 --reporter=line --global-timeout=420000 --shard=$$shard/4 --output=/workspace/test-results/shard-$$shard
        done

  - id: python-contracts
    waitFor: ["-"]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: sh
    args:
      - -ceu
      - |
        python3 -m unittest tests.test_deployment_event
        python3 -m unittest discover -s tests -p test_runtime_assets.py

  - id: stage-code-runtime
    waitFor: [build-process-log, source-contracts, python-contracts, assert-verified-candidate]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: python3
    args: [scripts/stage-runtime.py, --output, /workspace/.runtime-image]

  - id: build
    waitFor: [stage-code-runtime]
    name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --file
      - /workspace/.runtime-image/Dockerfile
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/czbudget-public:$COMMIT_SHA-$BUILD_ID
      - /workspace/.runtime-image

  - id: image-contract
    waitFor: [build]
    name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --entrypoint node \
          -v /workspace/scripts/verify-runtime-image-code.mjs:/tmp/verify-runtime-image-code.mjs:ro \
          -e PORT=8080 \
          europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/czbudget-public:$COMMIT_SHA-$BUILD_ID \
          /tmp/verify-runtime-image-code.mjs

  - id: start-image-browser-candidate
    waitFor: [image-contract]
    name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    args: [run, --detach, --name, psd-release-candidate, --network, cloudbuild, -e, PORT=8080, europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/czbudget-public:$COMMIT_SHA-$BUILD_ID]

  - id: image-browser-contract
    waitFor: [start-image-browser-candidate, component-verification]
    name: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: bash
    args:
      - -ceu
      - |
        test -d node_modules/@playwright/test || npm ci
        npx playwright test --config=playwright.release.config.mjs --max-failures=1

  - id: push
    waitFor: [build]
    name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    args: [push, europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/czbudget-public:$COMMIT_SHA-$BUILD_ID]

  - id: assert-current-main
    waitFor: [assert-single-production, component-verification, full-verification, image-contract, image-browser-contract, push]
    name: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    entrypoint: node
    args: [scripts/assert-current-main.mjs, $COMMIT_SHA, /workspace/.deploy-current-main]

  - id: read-active-data-release
    waitFor: [assert-current-main]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: sh
    args:
      - -ceu
      - |
        mkdir -p /workspace/.active-data
        if [ -f /workspace/.deploy-current-main ]; then
          gcloud storage cp ${_PUBLIC_SNAPSHOT_BASE_URL}/current.json /workspace/.active-data/municipal.json
          gcloud storage cp ${_CITYVIZOR_SNAPSHOT_BASE_URL}/current.json /workspace/.active-data/cityvizor.json
          gcloud storage cp ${_STATIC_ASSET_BASE_URL}/current.json /workspace/.active-data/static-assets.json
        fi

  - id: deploy
    waitFor: [read-active-data-release]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: sh
    env:
      - PUBLIC_SNAPSHOT_POINTER=/workspace/.active-data/municipal.json
      - CITYVIZOR_SNAPSHOT_POINTER=/workspace/.active-data/cityvizor.json
      - STATIC_ASSET_POINTER=/workspace/.active-data/static-assets.json
    args:
      - scripts/deploy-immutable.sh
      - $PROJECT_ID
      - europe-west1
      - czbudget-public
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/czbudget-public:$COMMIT_SHA-$BUILD_ID
      - /workspace/.deploy-current-main
      - ${_PUBLIC_SNAPSHOT_BASE_URL}
      - ${_CITYVIZOR_SNAPSHOT_BASE_URL}
      - ${_PROCESS_LOG_BASE_URL}
      - $COMMIT_SHA
      - $BUILD_ID

  - id: publish-deployment-event
    waitFor: [deploy]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:b3c19d28b18621203fc6e360515061c086c3b103dc4cf09ff80051e1473ed5ec
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ -f /workspace/.deployment-event.json ]; then
          gcloud storage cp /workspace/.deployment-event.json ${_PROCESS_LOG_BASE_URL}/deployments/$BUILD_ID.json
        fi

timeout: 1800s
queueTtl: 600s
tags: [plane-web, production-deploy]

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/czbudget-public:$COMMIT_SHA-$BUILD_ID

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PUBLIC_SNAPSHOT_BASE_URL: gs://czbudget-janrezab-public-snapshots/municipal
  _CITYVIZOR_SNAPSHOT_BASE_URL: gs://czbudget-janrezab-public-snapshots/cityvizor
  _STATIC_ASSET_BASE_URL: gs://czbudget-janrezab-public-snapshots/static-assets
  _PROCESS_LOG_BASE_URL: gs://czbudget-janrezab-public-snapshots/process-log
